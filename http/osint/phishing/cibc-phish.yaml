id: cibc-phish

info:
  name: CIBC phishing Detection
  author: rxerium
  severity: info
  description: |
    A CIBC phishing website was detected
  reference:
    - https://cibc.com
  metadata:
    max-request: 1
  tags: phishing,cibc,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Personal Banking and Financial Services | CIBC'

      - type: word
        part: body
        words:
          - 'Bank on your terms with CIBC – whether it’s in person, over the phone or online, CIBC has you covered'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"cibc.com")'
