id: humble-bundle-phish

info:
  name: Humble Bundle phishing Detection
  author: rxerium
  severity: info
  description: |
    A Humble Bundle phishing website was detected
  reference:
    - https://humblebundle.com
  metadata:
    max-request: 1
  tags: phishing,humble-bundle,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Humble Bundle | game bundles, book bundles, software bundles, and more'

      - type: word
        part: body
        words:
          - 'Humble Bundle sells games, books, software, and more'
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"humblebundle.com")'
