id: eaton-ups-webcards-panel

info:
  name: Eaton UPS Web Card - Login Panel
  author: rxerium
  severity: info
  description: |
    An Eaton UPS Web Card management interface was detected. Eaton UPS Web Cards provide
    network-based monitoring and management of Eaton uninterruptible power supplies.
  reference:
    - https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/network-cards-and-snmp-cards.html
  metadata:
    max-request: 1
    shodan-query: http.title:"Eaton UPS Web Card"
  tags: panel,ics,ups,eaton,power,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Eaton UPS Web Card</title>'

      - type: status
        status:
          - 200
