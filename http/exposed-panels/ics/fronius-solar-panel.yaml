id: fronius-solar-panel

info:
  name: Fronius Solar Inverter - Panel
  author: rxerium
  severity: info
  description: |
    Fronius solar inverter web interface detected. Fronius inverters are used in residential and commercial solar PV installations for DC to AC power conversion and monitoring.
  metadata:
    verified: true
    max-request: 1
    vendor: fronius
    product: solar-inverter
    shodan-query: "Fronius"
  tags: panel,ics,solar,energy,fronius

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "title ng-bind=\"'Fronius:"

      - type: status
        status:
          - 200
