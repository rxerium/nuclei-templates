id: hms-anybus-mbus-panel

info:
  name: HMS Anybus M-Bus Gateway - Login Panel
  author: rxerium
  severity: info
  description: |
    An HMS Networks Anybus M-Bus/MTCP gateway web interface was detected. Anybus M-Bus gateways
    provide Modbus TCP to M-Bus bridging for industrial metering and building automation systems.
  reference:
    - https://www.hms-networks.com/anybus/anybus-m-bus
  metadata:
    max-request: 1
    shodan-query: http.title:"Anybus M-Bus"
  tags: panel,ics,gateway,anybus,hms,mbus,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Anybus M-Bus/MTCP'

      - type: status
        status:
          - 200
