id: comap-ibcom-panel

info:
  name: ComAp IB-COM Gateway - Login Panel
  author: rxerium
  severity: info
  description: |
    A ComAp IB-COM communication module web interface was detected. ComAp IB-COM is an
    Ethernet gateway used with ComAp InteliGen and InteliSys generator controllers for
    remote monitoring and control of diesel and gas generator sets.
  reference:
    - https://www.comap-control.com/products/detail/ib-com
  metadata:
    max-request: 1
    shodan-query: http.html:"IB-COM" http.html:"ComAp"
  tags: panel,ics,scada,comap,generator,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '&copy ComAp'

      - type: status
        status:
          - 200
