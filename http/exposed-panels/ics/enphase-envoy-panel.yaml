id: enphase-envoy-panel

info:
  name: Enphase Envoy Solar Gateway - Panel
  author: rxerium
  severity: info
  description: |
    Enphase Envoy is a communications gateway for Enphase microinverter solar systems.
    The embedded web interface provides local monitoring and management of solar panels
    and battery systems. Commonly exposed on port 80 at the installer/homeowner network level.
  reference:
    - https://enphase.com/store/communications/envoy
  metadata:
    max-request: 1
    shodan-query: 'http.html:"Enphase Energy" http.html:"Envoy"'
  tags: panel,enphase,envoy,solar,energy,ics,iot

http:
  - method: GET
    path:
      - "{{BaseURL}}"


    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Enphase Energy"
        part: body

      - type: word
        words:
          - "Envoy"
          - "envoy"
        condition: or
        part: body

      - type: status
        status:
          - 200
          - 302
