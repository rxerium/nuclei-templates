id: supermicro-ipmi-panel

info:
  name: Supermicro IPMI - Login Panel
  author: rxerium
  severity: info
  description: |
    Supermicro IPMI (Intelligent Platform Management Interface) provides remote server management capabilities including power control, hardware monitoring, and KVM-over-IP access.
  reference:
    - https://www.supermicro.com/en/solutions/management-software/ipmi-utilities
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Supermicro"'
  tags: panel,supermicro,ipmi,ics,server-management

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Supermicro'
        part: body

      - type: status
        status:
          - 200
