id: ifm-io-link-master-panel

info:
  name: IFM Electronic IO-Link Master - Panel
  author: rxerium
  severity: info
  description: |
    IFM Electronic IO-Link Master devices (AL1350, AL1352, AL1322 series) expose an
    embedded web interface for device configuration and diagnostics. These are industrial
    sensor/actuator communication controllers commonly deployed on factory floors.
  reference:
    - https://www.ifm.com/us/en/applications/io-link.html
  metadata:
    max-request: 1
    shodan-query: 'http.title:"IO-Link Master" http.html:"ifm"'
  tags: panel,ifm,io-link,ics,ot,industrial

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "IO-Link Master"
        part: body

      - type: word
        words:
          - "ifm"
          - "ifm electronic"
        condition: or
        part: body

      - type: status
        status:
          - 200
