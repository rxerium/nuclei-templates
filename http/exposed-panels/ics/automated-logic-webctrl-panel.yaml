id: automated-logic-webctrl-panel

info:
  name: Automated Logic WebCTRL - Login Panel
  author: rxerium
  severity: info
  description: |
    Automated Logic WebCTRL is a web-based building automation system (BAS) used
    for HVAC, lighting, and energy management in commercial buildings. The web
    interface is served by the proprietary CJServer, which is a unique identifier
    for this product.
  reference:
    - https://www.automatedlogic.com/en/products/webctrl-building-automation-system/
  metadata:
    max-request: 1
    shodan-query: http.server:"CJServer"
  tags: panel,ics,bms,hvac,building-automation,automated-logic,webctrl

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "CJServer"

      - type: status
        status:
          - 200
          - 302
