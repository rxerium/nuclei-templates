id: tridium-niagara-panel

info:
  name: Tridium Niagara - JACE Web Server Panel
  author: rxerium
  severity: info
  description: |
    Tridium Niagara (JACE) is one of the most widely deployed building automation
    frameworks globally, used in HVAC, lighting, and energy management systems.
    The Niagara4 web UI is served on port 443/8443 with a self-signed certificate
    where the CN contains "Niagara4" and the issuer references Tridium.
  reference:
    - https://www.tridium.com/us/en/products/niagara
  metadata:
    max-request: 2
    shodan-query: ssl.cert.subject.cn:"Niagara4" port:8443
  tags: panel,ics,bms,building-automation,tridium,niagara,jace,hvac

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Niagara"
          - "webstart/nwl"
        condition: or

      - type: status
        status:
          - 200
          - 302
