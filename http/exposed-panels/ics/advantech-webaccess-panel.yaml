id: advantech-webaccess-panel

info:
  name: Advantech WebAccess HMI - Login Panel
  author: rxerium
  severity: info
  description: |
    Advantech WebAccess is a browser-based HMI/SCADA software platform developed by Advantech (formerly BroadWin) for industrial automation and control.
  reference:
    - https://webaccess.advantech.com
  metadata:
    max-request: 2
    shodan-query: 'http.title:"Advantech WebAccess"'
  tags: panel,ics,advantech,scada,hmi

http:
  - method: GET
    path:
      - "{{BaseURL}}"


    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Advantech WebAccess'
          - 'BroadWin'
        condition: or

      - type: status
        status:
          - 200
