id: eaton-powerxpert-panel

info:
  name: Eaton Power Xpert Gateway - Login Panel
  author: rxerium
  severity: info
  description: |
    Eaton Power Xpert Gateway panel has been detected.
  reference:
    - https://www.eaton.com/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Eaton" http.html:"Power Xpert"'
  tags: panel,eaton,powerxpert,ics,energy

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Eaton Power Xpert Gateway'
        part: body

      - type: status
        status:
          - 200
