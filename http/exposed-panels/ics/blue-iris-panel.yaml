id: blue-iris-panel

info:
  name: Blue Iris VMS - Panel
  author: rxerium
  severity: info
  description: |
    Blue Iris video management software panel detected. Blue Iris is a popular video surveillance management system for IP cameras.
  metadata:
    verified: true
    max-request: 1
    vendor: blue-iris-software
    product: blue-iris
    shodan-query: "Blue Iris Login"
  tags: panel,ics,surveillance,vms,blue-iris

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Blue Iris Login"

      - type: status
        status:
          - 200
