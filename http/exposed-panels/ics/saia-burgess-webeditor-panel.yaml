id: saia-burgess-webeditor-panel

info:
  name: Saia-Burgess WebEditor HMI - Login Panel
  author: rxerium
  severity: info
  description: |
    A Saia-Burgess Controls AG WebEditor HMI interface was detected. WebEditor is used
    to create and serve Java-applet-based HMI screens for Saia PCD programmable controllers
    in building automation, HVAC, and industrial control installations.
  reference:
    - https://www.saia-pcd.com/en/products/software/saia-pcd-tools/Pages/webeditor.aspx
  metadata:
    max-request: 1
    shodan-query: http.html:"Saia-Burgess Controls AG - WebEditor"
  tags: panel,ics,scada,hmi,saia,bms,building-automation,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Saia-Burgess Controls AG - WebEditor'

      - type: status
        status:
          - 200
