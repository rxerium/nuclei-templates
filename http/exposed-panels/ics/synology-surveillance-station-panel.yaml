id: synology-surveillance-station-panel

info:
  name: Synology Surveillance Station - Login Panel
  author: rxerium
  severity: info
  description: |
    Synology Surveillance Station NVR management panel has been detected.
  reference:
    - https://www.synology.com/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"Surveillance Station"'
  tags: panel,synology,surveillance,nvr,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Surveillance Station'
        part: body

      - type: status
        status:
          - 200
