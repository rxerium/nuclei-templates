id: sma-power-reducer-panel

info:
  name: SMA Power Reducer Box - Panel
  author: rxerium
  severity: info
  description: |
    SMA Power Reducer Box panel detected. The Power Reducer Box is used for solar PV power management and curtailment control in grid-tied solar installations.
  metadata:
    verified: true
    max-request: 1
    vendor: sma
    product: power-reducer-box
    shodan-query: "SMA Power Reducer"
  tags: panel,ics,solar,energy,sma

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Power Reducer Box"

      - type: status
        status:
          - 200
