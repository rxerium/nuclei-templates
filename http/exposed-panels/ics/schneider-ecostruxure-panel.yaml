id: schneider-ecostruxure-panel

info:
  name: Schneider Electric EcoStruxure Building Operation - Login Panel
  author: rxerium
  severity: info
  description: |
    Schneider Electric EcoStruxure Building Operation (formerly StruxureWare)
    is an enterprise building management system for HVAC, lighting, power,
    and security. The WebStation interface is the browser-based access point
    for building operators and facility managers.
  reference:
    - https://www.se.com/ww/en/work/products/product-launch/building-operations/
    - https://www.se.com/ww/en/work/products/product-launch/ecostruxure-building-operation/
  metadata:
    max-request: 1
    shodan-query: http.title:"Building Operation"
  tags: panel,ics,bms,hvac,schneider,ecostruxure,building-automation,webstation

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Building Operation"

      - type: status
        status:
          - 200
