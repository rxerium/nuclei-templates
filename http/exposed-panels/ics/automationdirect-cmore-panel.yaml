id: automationdirect-cmore-panel

info:
  name: AutomationDirect C-more HMI - Login Panel
  author: rxerium
  severity: info
  description: |
    AutomationDirect C-more HMI panel has been detected.
  reference:
    - https://www.automationdirect.com/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"AutomationDirect" http.html:"C-more"'
  tags: panel,automationdirect,cmore,hmi,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'C-more -- the best HMI presented by AutomationDirect'
        part: body

      - type: status
        status:
          - 200
