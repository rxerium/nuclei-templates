id: ubiquiti-unifi-protect-panel

info:
  name: Ubiquiti UniFi Protect - Login Panel
  author: rxerium
  severity: info
  description: |
    Ubiquiti UniFi Protect Network Video Recorder management panel has been detected.
  reference:
    - https://www.ui.com/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"UniFi Protect"'
  tags: panel,ubiquiti,unifi,protect,nvr,surveillance,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'UniFi Protect Network Video Recorder'
        part: body

      - type: status
        status:
          - 200
