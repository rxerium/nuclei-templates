id: goodwe-sems-portal-panel

info:
  name: GoodWe SEMS Portal - Login Panel
  author: rxerium
  severity: info
  description: |
    GoodWe SEMS (Smart Energy Management System) Portal is a web-based monitoring and management platform for GoodWe solar inverters, providing real-time energy data, remote configuration, and fleet management.
  reference:
    - https://www.goodwe.com/sems
  metadata:
    max-request: 1
    shodan-query: 'http.title:"GOODWE SEMS PORTAL"'
  tags: panel,goodwe,ics,scada,solar

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'GOODWE SEMS PORTAL'
        part: body

      - type: status
        status:
          - 200
