id: westermo-router-panel

info:
  name: Westermo Industrial Router - Login Panel
  author: rxerium
  severity: info
  description: |
    Westermo industrial router web interface panel has been detected.
  reference:
    - https://www.westermo.com/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"Westermo"'
  tags: panel,westermo,router,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'lynx - westermo'
        part: body

      - type: status
        status:
          - 200
