id: bosch-divar-nvr-panel

info:
  name: Bosch DIVAR NVR - Login Panel
  author: rxerium
  severity: info
  description: |
    Bosch DIVAR 700 Series Network Video Recorder management panel has been detected.
  reference:
    - https://www.boschsecurity.com/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"Bosch" http.html:"DIVAR"'
  tags: panel,bosch,divar,nvr,surveillance,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Divar 700 Series'
        part: body

      - type: status
        status:
          - 200
