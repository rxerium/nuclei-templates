id: sma-sunny-webbox-panel

info:
  name: SMA Sunny WebBox - Login Panel
  author: rxerium
  severity: info
  description: |
    SMA Sunny WebBox is an embedded web server for monitoring and controlling SMA solar inverters and energy systems.
  reference:
    - https://www.sma.de/en/products/monitoring-control/sunny-webbox
  metadata:
    max-request: 2
    shodan-query: 'http.title:"Sunny WebBox"'
  tags: panel,ics,sma,solar,energy

http:
  - method: GET
    path:
      - "{{BaseURL}}"


    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Sunny WebBox'

      - type: status
        status:
          - 200
