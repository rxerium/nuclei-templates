id: vertiv-intellislot-panel

info:
  name: Vertiv IntelliSlot Web Card - Login Panel
  author: rxerium
  severity: info
  description: |
    A Vertiv (formerly Emerson/Liebert) IntelliSlot Web/485 Card interface was detected.
    IntelliSlot cards provide network-based monitoring and management of Vertiv Liebert UPS
    and power conditioning systems in data centre environments.
  reference:
    - https://www.vertiv.com/en-us/products-catalog/monitoring-control-and-management/software-and-firmware/liebert-intellislot-unity-card/
  metadata:
    max-request: 1
    shodan-query: http.html:"Liebert Corporation" http.html:"IntelliSlot"
  tags: panel,ics,ups,vertiv,liebert,power,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'content="Liebert Corporation'

      - type: status
        status:
          - 200
