id: solax-inverter-panel

info:
  name: SolaX Power Inverter - Login Panel
  author: rxerium
  severity: info
  description: |
    SolaX Power inverter monitoring panel has been detected.
  reference:
    - https://www.solaxpower.com/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Solax"'
  tags: panel,solax,ics,solar

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>SOLAX</title>'
        part: body

      - type: status
        status:
          - 200
