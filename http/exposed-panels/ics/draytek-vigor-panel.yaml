id: draytek-vigor-panel

info:
  name: DrayTek Vigor Router - Panel
  author: rxerium
  severity: info
  description: |
    DrayTek Vigor router web interface detected. Vigor routers are widely deployed SMB and enterprise networking devices supporting VPN, load balancing, and WAN connectivity.
  metadata:
    verified: true
    max-request: 1
    vendor: draytek
    product: vigor-router
    shodan-query: "Vigor Login Page"
  tags: panel,ics,router,network,draytek

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Vigor Login Page"

      - type: status
        status:
          - 200
