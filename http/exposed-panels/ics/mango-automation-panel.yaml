id: mango-automation-panel

info:
  name: Mango Automation - Login Panel
  author: rxerium
  severity: info
  description: |
    Mango Automation by Infinite Automation Systems is an open-source SCADA/HMI
    platform for industrial IoT, supporting Modbus, BACnet, SNMP, and other
    protocols for real-time data acquisition and control.
  reference:
    - https://infiniteautomation.com/mango-automation-overview/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"Mango Automation, by Infinite Automation"'
  tags: panel,mango,scada,ics,hmi,infinite-automation

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Mango Automation, by Infinite Automation'
        part: body

      - type: status
        status:
          - 200
