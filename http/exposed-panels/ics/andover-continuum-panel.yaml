id: andover-continuum-panel

info:
  name: Andover Continuum BMS - Login Panel
  author: rxerium
  severity: info
  description: |
    Andover Continuum Building Management System panel has been detected.
  reference:
    - https://www.carrier.com/
  metadata:
    max-request: 1
    shodan-query: 'http.html:"Andover Continuum"'
  tags: panel,andover,continuum,ics,bms

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Andover Continuum'
        part: body

      - type: status
        status:
          - 200
