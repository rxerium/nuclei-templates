id: siemens-desigo-panel

info:
  name: Siemens Desigo CC - Login Panel
  author: rxerium
  severity: info
  description: |
    Siemens Desigo CC is a building management system (BMS) used for HVAC,
    fire safety, and security in large commercial and institutional buildings.
    The web interface (Desigo Web) is accessible via browser and is commonly
    deployed on non-standard HTTPS ports.
  reference:
    - https://www.siemens.com/global/en/products/buildings/hvac/desigo-cc.html
  metadata:
    max-request: 1
    shodan-query: http.title:"Desigo Web"
  tags: panel,ics,bms,hvac,siemens,desigo,building-automation

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Desigo"

      - type: status
        status:
          - 200
          - 302
