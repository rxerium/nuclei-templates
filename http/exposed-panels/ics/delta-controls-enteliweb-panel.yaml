id: delta-controls-enteliweb-panel

info:
  name: Delta Controls enteliWEB - Login Panel
  author: rxerium
  severity: info
  description: |
    Delta Controls enteliWEB is a web-based building automation and energy
    management system. It provides browser access to BACnet building controllers
    for HVAC monitoring and control. Exposed instances may allow access to
    building operations without authentication.
  reference:
    - https://www.deltacontrols.com/products/enteliweb/
  metadata:
    max-request: 1
    shodan-query: http.title:"enteliWEB Login Page"
  tags: panel,ics,bms,bacnet,building-automation,delta-controls,enteliweb

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "enteliWEB"

      - type: status
        status:
          - 200
          - 301
          - 302
