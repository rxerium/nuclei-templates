id: phoenix-contact-visu-plus-panel

info:
  name: Phoenix Contact Visu+ HMI - Login Panel
  author: rxerium
  severity: info
  description: |
    Phoenix Contact Visu+ is an HMI/SCADA visualization software used in industrial automation environments for process monitoring and control.
  reference:
    - https://www.phoenixcontact.com/en-us/products/hmi-software-visu
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Visu" http.html:"Phoenix Contact"'
  tags: panel,ics,phoenix-contact,hmi,scada

http:
  - method: GET
    path:
      - "{{BaseURL}}"


    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Visu'
        part: title

      - type: word
        words:
          - 'Phoenix Contact'
          - 'phoenixcontact'
        condition: or

      - type: status
        status:
          - 200
