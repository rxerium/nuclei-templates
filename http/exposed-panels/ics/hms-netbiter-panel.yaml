id: hms-netbiter-panel

info:
  name: HMS Netbiter Remote Management - Login Panel
  author: rxerium
  severity: info
  description: |
    An HMS Networks Netbiter remote management gateway web interface was detected.
    Netbiter gateways provide cloud-connected remote monitoring for industrial equipment,
    SCADA systems, and energy infrastructure.
  reference:
    - https://www.hms-networks.com/netbiter
  metadata:
    max-request: 1
    shodan-query: http.title:"Netbiter"
  tags: panel,ics,gateway,netbiter,hms,scada,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'based on NetBiter'

      - type: status
        status:
          - 200
