id: siemens-wincc-oa-panel

info:
  name: Siemens WinCC OA - Login Panel
  author: rxerium
  severity: info
  description: |
    Siemens WinCC OA (formerly ETM PVSS) is an industrial SCADA/HMI software platform.
    The web client exposes a login interface on the network for remote operator access.
  reference:
    - https://www.siemens.com/global/en/products/automation/industry-software/automation-software/wincc-oa.html
    - https://www.etm.at/en/products/wincc-oa/
  metadata:
    max-request: 3
    shodan-query: 'http.title:"WinCC OA"'
  tags: panel,siemens,scada,ics,wincc,ot

http:
  - method: GET
    path:
      - "{{BaseURL}}"


    matchers-condition: and
    matchers:
      - type: word
        words:
          - "WinCC OA"
        part: body

      - type: status
        status:
          - 200
          - 302
