id: saia-pcd-webserver-panel

info:
  name: Saia PCD Web Server - Login Panel
  author: rxerium
  severity: info
  description: |
    Saia-Burgess Controls PCD (Programmable Controller for Devices) is a building
    automation and HVAC controller with an integrated web server for remote monitoring
    and configuration of BACnet/Modbus installations.
  reference:
    - https://www.saia-pcd.com/en/products/plc/pcd-overview/Pages/overview.aspx
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Saia PCD Web Server"'
  tags: panel,saia,pcd,ics,bms,hvac,building-automation

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Saia PCD Web Server'
        part: body

      - type: status
        status:
          - 200
