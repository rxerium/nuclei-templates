id: philips-dynalite-panel

info:
  name: Philips Dynalite Ethernet Gateway - Panel
  author: rxerium
  severity: info
  description: |
    Philips Dynalite Ethernet Gateway panel detected. The Dynalite system is used for lighting control in commercial and residential buildings.
  metadata:
    verified: true
    max-request: 1
    vendor: philips
    product: dynalite
    shodan-query: "Philips Dynalite"
  tags: panel,ics,lighting,dynalite,philips

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Philips Dynalite"

      - type: status
        status:
          - 200
