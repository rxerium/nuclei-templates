id: sungrow-inverter-panel

info:
  name: Sungrow Solar Inverter - Panel
  author: rxerium
  severity: info
  description: |
    Sungrow solar inverter web interface detected. Sungrow inverters are used in utility-scale, commercial, and residential solar installations for power conversion and grid management.
  metadata:
    verified: true
    max-request: 1
    vendor: sungrow
    product: solar-inverter
    shodan-query: "SUNGROW"
  tags: panel,ics,solar,energy,sungrow

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>SUNGROW</title>"

      - type: status
        status:
          - 200
