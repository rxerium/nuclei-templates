id: accuenergy-acuvim-panel

info:
  name: Accuenergy Acuvim II - Login Panel
  author: rxerium
  severity: info
  description: |
    Accuenergy Acuvim II Series Meter web server was detected. Acuvim II is a high-end
    multifunction power meter used in power distribution and plant automation systems.
  reference:
    - https://www.accuenergy.com/products/acuvim-ii-series-power-meter/
  metadata:
    max-request: 1
    shodan-query: http.html:"Acuvim II Series Meter Web Server"
  tags: panel,ics,scada,accuenergy,acuvim,energy,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Acuvim II Series Meter Web Server'

      - type: status
        status:
          - 200
