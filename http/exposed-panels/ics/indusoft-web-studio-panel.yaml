id: indusoft-web-studio-panel

info:
  name: InduSoft Web Studio - Login Panel
  author: rxerium
  severity: info
  description: |
    An InduSoft Web Studio (IWS) SCADA HMI web interface was detected. InduSoft Web Studio
    is a SCADA/HMI platform acquired by AVEVA used in industrial automation and process control.
  reference:
    - https://www.aveva.com/en/products/indusoft-web-studio/
  metadata:
    max-request: 1
    shodan-query: http.html:"InduSoft Web Studio"
  tags: panel,ics,scada,hmi,indusoft,aveva,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'InduSoft Web Studio'

      - type: status
        status:
          - 200
